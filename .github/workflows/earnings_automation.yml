name: Weekly Earnings Updater

on:
  schedule:
    - cron: '0 2 * * 0' # Har Sunday subah 7:30 AM (IST) automatically run hoga
  workflow_dispatch: # Manual run button aapke liye

jobs:
  update-earnings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          pip install supabase pandas yfinance
          
      - name: Run Earnings Automation Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python update_earnings.py
