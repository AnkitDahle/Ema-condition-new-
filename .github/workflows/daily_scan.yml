name: Daily Stock Scanner

on:
  schedule:
    # UTC 10:30 AM = IST 4:00 PM (Monday se Friday)
    - cron: '30 10 * * 1-5'
  
  # Yeh line aapko website aur GitHub se manually scan chalane ki power deti hai
  workflow_dispatch: 

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python with Caching
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'  # <--- MAGIC WORD: Ab har baar install mein time waste nahi hoga!

      - name: Install Tools & Libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Master Scanner Script
        env:
          # Aapke Supabase (Database) ke secure passwords
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scanner_job.py
