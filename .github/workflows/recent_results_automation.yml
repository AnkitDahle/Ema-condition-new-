name: Fetch Recent Results (Time Machine)

on:
  schedule:
    # Yeh roz shaam 7:00 PM IST (13:30 UTC) par automatically chalega
    - cron: '30 13 * * *'
  
  # Yeh button dega jisse aap GitHub se manually bhi script chala sakte hain
  workflow_dispatch: 

jobs:
  update-recent-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance supabase requests

      - name: Run Fetch Recent Results Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python fetch_recent_results.py
